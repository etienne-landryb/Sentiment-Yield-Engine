# The app renders everything through explicit st.* calls; disable "magic" so a
# trailing module-level expression (e.g. main()) is never auto-written as st.help.
[runner]
magicEnabled = false

# "auto" only shows the toolbar on hover (fades out after initial paint) — that's
# what made the ⋮ menu appear briefly then vanish. "viewer" keeps the viewer-facing
# menu (About/Settings/Print/Report a bug) always visible, so Settings → Appearance
# stays reachable.
[client]
toolbarMode = "viewer"

# Brand accent + font only. No background/text colors, so the theme follows the
# viewer's system setting and the light/dark toggle stays available.
[theme]
primaryColor = "#4C78A8"
font = "sans serif"