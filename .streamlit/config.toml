# The app renders everything through explicit st.* calls; disable "magic" so a
# trailing module-level expression (e.g. main()) is never auto-written as st.help.
[runner]
magicEnabled = false

# Nothing here pins a palette — any [theme] section, even one that only sets
# primaryColor/font, disables the System/Light/Dark picker entirely (confirmed
# by diffing against sibling apps: the two with no config.toml and the one
# with a [theme]-free config.toml all keep the picker; this app's [theme]
# block was what removed it). Brand accent + font are applied via CSS in
# app/streamlit_app.py's _CSS block instead.
[client]
toolbarMode = "auto"