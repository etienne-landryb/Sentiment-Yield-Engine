# ─────────────────────────────────────────────────────────────────────────────
# Analysis parameters (methodology constants, per README § Methodology). UNCHANGED.
# ─────────────────────────────────────────────────────────────────────────────
analysis:
  polarity_threshold: 0.05      # VADER compound ±0.05 → positive / neutral / negative
  event:
    z_thresh: 2.0
    window: 30                  # rolling window (days) for sentiment mean/std
  correlation:
    max_lag: 5                  # lead/lag scan range (± days)
    rolling_window: 30          # rolling-correlation window (days)
  volatility_window: 20         # realized-vol window (days)

  # Data-quality composite (0–100). Weights + target per README table.
  quality:
    target: 40                  # target article_count for the Volume sub-score
    weights:
      volume: 0.25              # min(article_count / target, 1)
      diversity: 0.20           # 1 - HHI
      duplicate: 0.15           # 1 - duplicate_rate
      coverage: 0.20            # days_with_data / days_in_window
      scoring: 0.20             # scored_headlines / total_headlines
