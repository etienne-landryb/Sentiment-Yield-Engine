# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for countries, regions, instruments, and aggregates.
# Adding a country / instrument / region / aggregate here is the ONLY change
# required — no code edits. Nothing below is hard-coded anywhere in src/.
#
# Market model (post-yfinance): currency-vs-USD (FX) is the broad, reliable spine;
# the national equity index is a country-specific overlay. Per-instrument SOURCE is
# fixed here and never swapped at runtime.
#   • FX / US index / US yield → FRED (keyless, ~weekly H.10 cadence for FX)
#   • national index           → Twelve Data (free key, daily; ≤8/min, 800/day)
#   • where Twelve Data lacks a native index → pin a US-listed ETF proxy here.
# ─────────────────────────────────────────────────────────────────────────────

# Applied to every country's GDELT pull.
base_query: '(economy OR inflation OR "interest rate" OR "central bank" OR market OR recession OR GDP OR unemployment)'

# Data-source cadences (drives the two-speed cache + freshness labels).
sources:
  fred: {cadence: weekly}
  twelvedata: {cadence: daily}
  gdelt: {cadence: daily}

# Region metadata (labels + map grouping). Add regions here; add countries below.
regions:
  north_america: {label: North America}
  europe: {label: Europe}
  asia_pacific: {label: Asia-Pacific}
  latin_america:
    label: Latin America
  africa_mideast:
    label: Africa & Middle East

countries:
