# ─────────────────────────────────────────────────────────────────────────────
# Keyword / topic dictionaries (V1). Deterministic and interpretable.
# A headline is tagged with the topic that has the most keyword hits; ties break
# by config order; "Other" if no keyword matches. Adding a topic is a config edit.
# Keywords are matched case-insensitively as whole words/phrases.
# ─────────────────────────────────────────────────────────────────────────────
